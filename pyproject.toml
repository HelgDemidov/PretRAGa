[project]
name = "pretraga"
version = "0.1.0"
description = "Document acquisition, conversion, and retrieval-augmented generation pipeline"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber==0.11.10",   # PDF -> Markdown
    "trafilatura==2.2.0",    # HTML -> Markdown (main-content extraction)
    "mammoth==1.12.1",       # DOCX -> HTML, with a custom image handler
    "markdownify==1.2.3",    # HTML -> Markdown (subclassed for the DOCX path)
    "lxml==6.1.1",           # promote ELI markup to real <hN> before trafilatura
    "openpyxl==3.1.5",       # XLSX -> Markdown, plus embedded-chart parts
    "duckdb==1.5.5",         # bronze layer for raw registry-connector payloads
    "mermaidx==0.9.4",       # render-validate mermaid output with real mermaid.js
    "pydantic==2.13.4",      # curated-record schema
    "PyYAML==6.0.3",         # read/write records and controlled vocabularies
    "networkx==3.6.1",       # heterogeneous knowledge graph
    "tokenizers==0.23.1",    # bge-m3 tokenizer for canonical chunking
    "numpy==2.5.2",          # vector operations
    "onnxruntime==1.29.0",   # bge-m3 int8 ONNX inference, CPU
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "ruff==0.16.4",
    "pip-audit==2.10.1",              # CVE audit of dependencies
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",             # parallelises the mutation stand's outer loop (-m heavy -n auto)
    "types-PyYAML==6.0.12.20260518",
    "types-openpyxl==3.1.5.20260807",
    "reportlab==5.0.0",                # synthetic PDF fixtures for converter tests
    "types-reportlab==4.5.1.20260724",
    "hypothesis==6.165.0",             # property-based testing
    "erdantic==1.2.1",                 # ER diagrams generated directly from pydantic/dataclass models
    "import-linter==2.14",             # enforce import-boundary contracts between layers
    "grimp==3.15",                     # import graph backing import-linter
    "pydeps==3.0.7",                   # visual import graph; needs the system `graphviz` package (`dot`) installed separately
    "types-networkx==3.6.1.20260728",
]

[tool.uv]
package = false

# Every tool below is configured to discover its own targets from the repository
# root. The gate command therefore carries NO path list: adding src/ later needs
# no edit here and no edit to the command, so the two cannot drift apart.

[tool.ruff]
# `ruff check` with no arguments walks the repo and honours .gitignore.
target-version = "py312"
line-length = 110

[tool.ruff.lint.per-file-ignores]
# Throwaway negative-case classes assign pydantic's `model_config` dict; ruff
# cannot see their BaseModel ancestry across modules, so RUF012 misfires here
# (src/ is NOT exempted — the same idiom there is recognised and clean).
"tests/test_kinds.py" = ["RUF012"]

[tool.mypy]
# No `files` here on purpose. mypy has no .gitignore support, and an exclude
# list would be a second, hand-maintained copy of .gitignore that drifts from
# it. The gate feeds mypy exactly the Python files that would be committed
# (`git ls-files --cached --others --exclude-standard '*.py'`), so git stays
# the single source of "what is ours" and src/ needs no edit when it appears.
python_version = "3.12"
# src layout without an installed package: mypy resolves pretraga and the
# repo tools through mypy_path, so the gate command still carries no path list.
mypy_path = ["src", "tools"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pyright]
# Pylance/pyright resolve pretraga and the repo tools exactly the way mypy
# (mypy_path) and pytest (pythonpath) do — three tools, one path pair.
extraPaths = ["src", "tools"]

[tool.pytest.ini_options]
# No testpaths: discovery walks the repo, so tests added under src/ or tests/
# are picked up without editing a hand-maintained list here.
pythonpath = ["src", "tools"]
markers = [
    "heavy: slow or resource-hungry; excluded from the default gate filter",
]

[tool.coverage.run]
source = ["src", "tools"]
omit = ["*/conftest.py", "*/test_*.py"]

[tool.coverage.report]
# A floor that catches regressions, not a goal. Measured with exactly the gate
# command (75%), set two points lower for CI jitter. The number undercounts by
# design: the negative tests exercise the tools through subprocesses, which
# in-process coverage does not trace. The direct evidence that the tests can
# fail is the mutation harness (pytest -m heavy), not this percentage. Raise
# only on organic growth.
fail_under = 73
show_missing = true

[tool.importlinter]
root_packages = ["pretraga"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Rings: dependencies point inward"
type = "layers"
layers = ["pretraga.entrypoints", "pretraga.adapters", "pretraga.usecases", "pretraga.domain"]

[[tool.importlinter.contracts]]
name = "One door out: network only in an adapter"
type = "forbidden"
source_modules = ["pretraga.domain", "pretraga.usecases"]
forbidden_modules = ["urllib", "httpx", "requests"]

[[tool.importlinter.contracts]]
name = "No dynamic imports: the ring contract must stay checkable"
type = "forbidden"
source_modules = ["pretraga.domain", "pretraga.usecases", "pretraga.adapters"]
forbidden_modules = ["importlib"]
