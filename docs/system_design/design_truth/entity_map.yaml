# Карта сущностей и атрибутов PretRAGa — ИСТОЧНИК ИСТИНЫ карты.
# Писатель: куратор (правки только через диалог/ревью). Представления (entity_map.md)
# генерируются скриптом entity_map_build.py и руками не правятся.
#
# Разделение языков внутри файла — по назначению поля, а не по вкусу:
#   английский — всё, что является или станет символом в коде: id, имена атрибутов,
#                ключи групп и статусов, kind, тип связи, trigger, marks, implements;
#   русский    — всё, что читает человек: definition, note, ru, названия групп,
#                конвенции. Прозе — вся нюансировка, символу — проверяемость.
#
# Статусы атрибутов и пометки — блоки `statuses` и `marks` ниже, не в коде.
#
# Поля сущности:
#   id / ru / group / layer / kind / definition — обязательны
#   implements — список путей-префиксов кода, реализующего сущность; проверяется на
#                разрешимость. Породы с anchor: forbidden кода не имеют по определению
#                и якорей не несут — отдельной лазейки для этого не существует.
# Поля атрибута:
#   name / status — обязательны; note, trigger, marks — по месту (см. блоки
#   `statuses` и `marks`: там же сказано, какой статус требует триггера)

# Сквозные конвенции — прозаическая часть словаря; редактируются здесь,
# в единственном рукописном файле системы. Статей о сущностях не содержат.
conventions: |
  ## Терминологические конвенции

  - Слово **«источник»** в модели данных не используется. В живой речи оно означает
    отдельную публикацию/документ — и потому зарезервировано за человеческим языком.
    Поток документов из настроенного места добычи называется **каналом добычи**.
  - **«Кандидат»** — не сущность, а стадия жизненного цикла Документа (до приёмки в корпус).
  - Код — только английский; в скобках у каждой сущности — её имя в коде.

  ## Конвенции идентичности

  - Сущность с жизненным циклом получает **чеканный идентификатор** (непрозрачный,
    время-упорядоченный, класса UUIDv7) один раз, при первом появлении; он никогда не
    пересчитывается и не участвует в сравнении «то же самое или нет».
  - Неизменяемое значение **контент-адресуется** — ключ равен хэшу содержимого.
  - Сравнение и сопоставление — отдельный механизм на отдельных атрибутах
    (естественных координатах); ненадёжное значение не даёт ключа вовсе.
  - Ключ, разрешающийся в несколько сущностей, отзывается; сущности не сливаются автоматически.

  ## Конвенции писательства

  - У каждого артефакта **один писатель**; писатель по умолчанию — машина.
  - Поле, которое может заполнить только человек, обязано оправдать себя на
    кардинальности десятков (каналы, словари, таблицы правил), а не тысяч (документы).
    У документа обязательных ручных полей — ноль.
  - Человеческие решения входят в систему **командами инструмента**, а не правкой
    машинных файлов; единственная руками правимая поверхность — файлы поправок.
  - Машина никогда не пишет в человеческие файлы.

# Породы сущностей — закрытый словарь. Порода несёт ОБЯЗАТЕЛЬСТВА, а не ярлык:
# каждая колонка ниже — проверка. Новая порода — запись здесь, а не правка чекера.
#   anchor      required | forbidden — обязан ли иметь якорь кода (implements)
#   identity    required | optional | forbidden — обязан ли иметь атрибут marks: identity
#   version     required | optional — обязан ли нести версию (свою marks: version
#               либо через связь с сущностью, которая её несёт)
#   placement   required | optional | forbidden — обязан ли быть ИСТОЧНИКОМ связи класса placement
#   hosts       required | optional — обязан ли быть ЦЕЛЬЮ связи класса placement
#   attributes  required | forbidden — допускаются ли атрибуты вообще
# Нарушение forbidden — ошибка (это ошибка классификации, чинится без дизайн-решения).
# Незакрытое required — запись в реестре открытых обязательств: чинится дизайн-решением
# человека, поэтому считается и называется, но не блокирует.
kinds:
  data:
    ru: "данные"
    note: "хранимое с собственной схемой; получит pydantic-модель и дифф с ней"
    anchor: required
    identity: required
    version: optional
    placement: required
    hosts: optional
    attributes: required
  derived:
    ru: "производное"
    note: "восстановимо из источника, назад не пишет; инвалидируется версией"
    anchor: required
    identity: optional
    version: required
    placement: required
    hosts: optional
    attributes: required
  process:
    ru: "процесс"
    note: "поведение; своего хранения не имеет"
    anchor: required
    identity: forbidden
    version: optional
    placement: forbidden
    hosts: optional
    attributes: required
  store:
    ru: "хранилище"
    note: "носитель хранения; цель связей размещения"
    anchor: required
    identity: optional
    version: optional
    placement: optional
    hosts: required
    attributes: required
  data_file:
    ru: "файл данных (человек)"
    note: "человеко-писаный файл значений; кода не имеет, валидируется в CI"
    anchor: forbidden
    identity: forbidden
    version: optional
    placement: forbidden
    hosts: optional
    attributes: required
  extension:
    ru: "запись расширения"
    note: "запись таблицы расширений; новая разновидность — запись, а не правка ядра"
    anchor: required
    identity: forbidden
    version: required
    placement: forbidden
    hosts: optional
    attributes: required
  term:
    ru: "термин"
    note: "статья словаря без собственного носителя: ни кода, ни атрибутов"
    anchor: forbidden
    identity: forbidden
    version: optional
    placement: forbidden
    hosts: optional
    attributes: forbidden

# Статусы атрибутов — закрытый словарь. Код ветвится не по ИМЕНИ статуса, а по его
# свойствам, поэтому новый статус — запись здесь, а не правка чекера:
#   settled: false   — состав не закрыт; попадает в реестр незакрытого
#   requires_trigger — без триггера не проходит валидацию
#   awaits           — чего именно ждёт: спецификации, измерения или этапа
statuses:
  fixed:
    ru: "зафиксировано"
    icon: "✅"
    settled: true
    awaits: "—"
  placeholder:
    ru: "плейсхолдер"
    icon: "⬜"
    settled: false
    requires_trigger: true
    awaits: "спецификацию: существование согласовано, состав не расписан"
  implementation_time:
    ru: "выбор реализации"
    icon: "🔧"
    settled: false
    awaits: "измерение на живых данных: роль зафиксирована, исполнитель нет"
  deferred:
    ru: "отложено"
    icon: "⏩"
    settled: false
    awaits: "этап 2: сознательно вне MVP"

# Пометки атрибутов — закрытый словарь. Пометка называет РОЛЬ атрибута в сущности,
# и именно по ней порода проверяет свои обязательства identity и version.
marks:
  identity: "этот атрибут И ЕСТЬ идентичность сущности"
  version: "этот атрибут И ЕСТЬ версия, чей бамп инвалидирует продукцию"

# Классы связей — то, по чему ветвятся генераторы (сегодня: обязательство placement;
# далее: контракт слоёв import-linter строится по классу dependency).
relation_classes:
  composition: "владение: A состоит из B, жизненные циклы связаны"
  reference: "ссылка: A указывает на B, без владения"
  production: "производство: A порождает B"
  placement: "размещение: A хранится в B"
  dependency: "зависимость: A нужен B, чтобы работать"
  governance: "управление: A решает, проверяет или ограничивает B"

# Типы связей — закрытый, но расширяемый словарь: новый тип это запись здесь.
# `ru` — метка по умолчанию для представлений; связь может нести свою, более точную.
# `inverse_of` — тип записан в обратную сторону относительно канонической; объявление
# позволяет нормализовать направление механически, не переориентируя карту руками.
relation_types:
  instance_of:   {ru: "экземпляр типа", class: reference}
  composed_of:   {ru: "состоит из", class: composition}
  carries:       {ru: "несёт", class: composition}
  references:    {ru: "ссылается на", class: reference}
  classified_by: {ru: "классифицируется по", class: reference}
  produces:      {ru: "производит", class: production}
  produced_by:   {ru: "произведён по", class: production, inverse_of: produces}
  derived_from:  {ru: "производится из", class: production, inverse_of: produces}
  feeds:         {ru: "питает", class: production}
  stored_in:     {ru: "хранится в", class: placement}
  uses:          {ru: "вызывает", class: dependency}
  consumes:      {ru: "берёт на вход", class: dependency}
  reads:         {ru: "читает", class: dependency}
  governs:       {ru: "управляет", class: governance}

# Триггеры решений — закрытый словарь событий, при которых плейсхолдер обязан
# закрыться. Ключ — символ: по нему спецификация находит СВОИ плейсхолдеры.
# Свободный текст здесь уже разъезжался («спецификация ингеста» против «не позже
# проектирования ингеста» — одно событие двумя строками), поэтому он и закрыт.
triggers:
  acquisition_spec:               "спецификация добычи"
  ingest_spec:                    "спецификация ингеста"
  conversion_spec:                "спецификация конвертации"
  enrichment_spec:                "спецификация обогащения"
  synthesis_workshop_spec:        "спецификация мастерской синтеза"
  first_vocabulary_consumer_spec: "первая спецификация, использующая словарь"

# Группы — тематические, для чтения: «про что эта сущность». Ни на что не влияют,
# кроме компоновки представлений. НЕ путать со слоями.
groups:
  acquisition: "Добыча"
  content: "Документ и содержимое"
  facts_graph: "Факты и граф"
  storage: "Реестр и хранение"
  processes: "Процессы"
  query_synthesis: "Запросы и синтез"
  cross_cutting: "Сквозное"

# Слои — УПОРЯДОЧЕННЫЙ словарь: порядок записи и есть порядок разрешённой
# зависимости, сверху вниз. Слой вправе зависеть от лежащего ниже и от своего
# собственного; зависимость вверх — ошибка. Ось здесь одна и другая, чем у групп:
# группа отвечает «про что это», слой — «кто от кого вправе зависеть».
#
# Ограничиваются ТОЛЬКО связи класса dependency. Класс governance намеренно не
# ограничен: у него направление ребра не совпадает с направлением зависимости
# кода (таблица правил «вычисляет класс» документа, но зависит от неё код
# документа, а не наоборот), и обобщение проверки на него дало бы ложные ошибки.
#
# Отсюда же вырастет контракт слоёв import-linter — как только у сущностей
# появятся якоря кода: слой модуля равен слою его сущности.
layers:
  synthesis: "Мастерская синтеза"
  query: "Слой запросов"
  enrichment: "Обогащение"
  curation: "Триаж и дедупликация"
  registry: "Реестр корпуса"
  conversion: "Конвертация"
  acquisition: "Добыча"
  foundation: "Сквозное основание"

entities:
  # --- Добыча ---
  - id: Connector
    ru: "Коннектор"
    group: acquisition
    layer: acquisition
    kind: extension
    definition: |
      Код добычи для класса мест публикации; запись в таблице расширений. Идентичность:
      имя типа + версия записи; собственного id нет. Новый коннектор — новая запись,
      а не правка ядра. Ручная загрузка файлов и списки URL — вырожденные коннекторы
      с тем же контрактом.
    attributes:
      - {name: type_name, status: fixed, note: "имя типа — идентичность"}
      - {name: entry_version, status: fixed, marks: version, note: "версия записи; бамп инвалидирует её продукцию"}
      - {name: contract_full_view, status: fixed, note: "адаптер отдаёт полный срез; ядро не хранит состояние адаптера"}
  - id: AcquisitionChannel
    ru: "Канал добычи"
    group: acquisition
    layer: acquisition
    kind: data
    definition: |
      Настроенный экземпляр коннектора, дающий поток документов («EUR-Lex с запросом
      по ИИ» и «EUR-Lex с запросом по кибербезопасности» — два разных канала). Операционная
      конфигурация, не доменная сущность: расписание и периодичность опроса, заявленное
      покрытие, объявления гомогенности атрибутов, гигиена входа (Gate 0 — детерминированные
      фильтры без суждения о релевантности). Маленький иммутабельный id — только чтобы
      провенанс документов переживал переименования. Машинное состояние забора (курсоры,
      ошибки, карантин) — отдельный артефакт. Каналы выводятся (retire), не удаляются.
    attributes:
      - {name: id, status: fixed, marks: identity, note: "маленький иммутабельный id — для провенанса"}
      - {name: connector_type, status: fixed, note: "ссылка на запись расширения"}
      - {name: config, status: fixed, note: "нормализуема — для дедупликации каналов"}
      - {name: schedule_periodicity, status: fixed, note: "заявленная периодичность опроса"}
      - {name: declared_coverage, status: placeholder, trigger: acquisition_spec, note: "юрисдикции/тематики/типы — состав не расписан"}
      - {name: homogeneity_declarations, status: placeholder, trigger: acquisition_spec, note: "по каким атрибутам канал гомогенен"}
      - {name: gate0_rules, status: placeholder, trigger: acquisition_spec, note: "детерминированная гигиена входа"}
      - {name: lifecycle_states, status: placeholder, trigger: acquisition_spec, note: "retire-not-delete зафиксирован; полный список состояний — нет"}
      - {name: fetch_state, status: fixed, note: "курсоры/ошибки/карантин — отдельный машинный артефакт"}
  - id: AcquisitionAct
    ru: "Акт добычи"
    group: acquisition
    layer: acquisition
    kind: data
    definition: |
      Машинная запись журнала: какой канал, когда, что принёс. Писатель — машина.
    attributes:
      - {name: channel_ref, status: fixed}
      - {name: occurred_at, status: fixed}
      - {name: record_fields, status: placeholder, trigger: acquisition_spec, note: "полный состав записи журнала"}
  - id: RawPayload
    ru: "Сырой payload"
    group: acquisition
    layer: acquisition
    kind: data
    definition: |
      Скачанное тело документа как получено: неизменяемое значение, контент-адресованный
      файл. Хранится и для отвергнутых кандидатов. Первичный артефакт, а не производный:
      веб гниёт, сырьё лишь частично восстановимо повторным скачиванием — поэтому оно
      не живёт внутри стираемого файла базы.
    attributes:
      - {name: content_hash, status: fixed, marks: identity, note: "контент-адресация"}
      - {name: file_store, status: fixed, note: "контент-адресованные файлы, вне БД — веб гниёт"}
      - {name: retained_for_rejected, status: fixed, note: "хранится и для отвергнутых"}
      - {name: retention_policy, status: deferred, note: "ручка очистки по сроку — пост-MVP"}
  - id: AcquisitionHint
    ru: "Подсказка добычи"
    group: acquisition
    layer: acquisition
    kind: derived
    definition: |
      Производный сигнал пере-наполнения корпуса: висячие типизированные ссылки —
      документы, которые корпус цитирует, но не содержит. Машинно-генерируемая
      очередь кандидатов на добычу.
    attributes:
      - {name: source, status: fixed, note: "висячие типизированные ссылки: цитируется, но в корпусе нет"}

  # --- Документ и содержимое ---
  - id: Document
    ru: "Документ"
    group: content
    layer: registry
    kind: data
    definition: |
      Единица корпуса; сущность с историей (уровень «работы» — Work). Идентичность —
      чеканная, выдаётся на стадии кандидата. Сопоставимость — через схематизированные
      координаты происхождения: пары «схема + значение» (ELI, CELEX, номер в реестре,
      канонический URL). Жизненный цикл — закрытое множество: **кандидат → активен →
      выведен**; приёмка автоматическая (минимум приёмки), вывод — решение человека,
      внесённое командой. Классификационные атрибуты (издатель, тип, юрисдикция, уровень,
      обязательность, язык, тематики) — значения контролируемых словарей, заполняются
      машинно: детерминированно из payload коннектора либо извлечением с меткой inferred
      и уверенностью; неуверенное — в очередь исключений. Класс авторитетности не
      хранится — вычисляется таблицей правил.
    attributes:
      - {name: uuid, status: fixed, marks: identity, note: "чеканный, класса UUIDv7, на стадии кандидата"}
      - {name: origin_coordinates, status: fixed, note: "пары схема+значение (ELI/CELEX/реестр/URL)"}
      - {name: coordinate_scheme_whitelist, status: placeholder, trigger: ingest_spec, note: "какие схемы дают авто-склейку; URL — никогда"}
      - {name: lifecycle, status: fixed, note: "кандидат → активен → выведен; закрытое множество"}
      - {name: classification_attributes, status: fixed, note: "издатель, тип, юрисдикция, уровень, обязательность, язык, тематики — машинные, словарные"}
      - {name: authority_class, status: fixed, note: "вычисляется таблицей правил, не хранится"}
      - {name: completeness_score, status: fixed, note: "машинный счётчик полноты метаданных"}
      - {name: completeness_formula, status: placeholder, trigger: enrichment_spec}
      - {name: channel_ref, status: fixed}
      - {name: act_ref, status: fixed}
  - id: ContentVersion
    ru: "Версия содержимого"
    group: content
    layer: conversion
    kind: data
    definition: |
      Неизменяемое значение с **двухосным ключом (язык, редакция)**: перевод — не новая
      редакция, новая редакция — не перевод. Повторный забор с изменившимся содержимым
      порождает новую редакцию того же Документа. Payload версии контент-адресован.
    attributes:
      - {name: key, status: fixed, marks: identity, note: "двухосный ключ (язык, редакция)"}
      - {name: payload_ref, status: fixed}
  - id: CanonicalText
    ru: "Канонический текст"
    group: content
    layer: conversion
    kind: data
    definition: |
      Markdown-представление версии содержимого — **единственный несущий формат** корпуса
      (целостность якорного пространства). Внутри законны структурные острова: таблицы
      и mermaid-блоки; они якорятся как обычный текст, а их производство проверяется
      реальным рендером. Контент-адресован; связан с сырьём версионированной записью
      конвертации — это второе звено провенанса (транскрипции OCR и диаграмм наследуют
      свою оговорку через него).
    attributes:
      - {name: content_hash, status: fixed, marks: identity}
      - {name: format, status: fixed, note: "Markdown — единственный носитель; острова: таблицы, mermaid (проверка рендером)"}
  - id: ConversionRecord
    ru: "Запись конвертации"
    group: content
    layer: conversion
    kind: data
    definition: |
      Машинная запись второго звена провенанса: каким конвертером и какой его версией
      канонический текст произведён из сырья. Через неё транскрипции (OCR, диаграммы)
      наследуют свою оговорку.
    attributes:
      - {name: converter_entry_version, status: fixed, marks: version, note: "второе звено провенанса"}
      - {name: record_fields, status: placeholder, trigger: conversion_spec}
  - id: ProvenanceAnchor
    ru: "Якорь провенанса"
    group: content
    layer: conversion
    kind: data
    definition: |
      Тройка **(версия содержимого, хэш канонического текста, символьный интервал)** —
      публикуемый стабильный адрес улики. Не зависит от нарезки на фрагменты и её версий.
      Якоря живут **только в оригинале**: перевод не бывает носителем якорей.
    attributes:
      - {name: triple, status: fixed, marks: identity, note: "(версия содержимого, хэш канонического текста, символьный интервал)"}
      - {name: original_only, status: fixed, note: "якоря только в оригинале, не в переводах"}
  - id: Fragment
    ru: "Фрагмент"
    group: content
    layer: enrichment
    kind: derived
    definition: |
      Производная единица поиска — отрезок канонического текста с известным интервалом.
      Пересоздаётся свободно при смене нарезки; долгоживущие ссылки на фрагменты запрещены —
      ссылаются на якоря.
    attributes:
      - {name: span, status: fixed}
      - {name: chunker_version, status: fixed, marks: version, note: "пересоздаваем; долгоживущие ссылки на фрагменты запрещены"}
  - id: Translation
    ru: "Перевод"
    group: content
    layer: enrichment
    kind: derived
    definition: |
      Производное представление версии содержимого для чтения и, при необходимости,
      эмбеддинга. Линза, не носитель якорей; извлечение утверждений идёт по оригиналу.
    attributes:
      - {name: lens_only, status: fixed, note: "линза для чтения/эмбеддинга; не носитель якорей"}
      - {name: caching_detail, status: placeholder, trigger: enrichment_spec}

  # --- Факты и граф ---
  - id: Claim
    ru: "Утверждение"
    group: facts_graph
    layer: enrichment
    kind: data
    definition: |
      Значение, не сущность: «Документ W в версии V утверждает X». Идентичность производна
      от (якорь, нормализованное содержание). Якорь обязателен — проверяется на входе,
      утверждение без якоря непредставимо. Опциональная реляционная структура
      (субъект-сущность, предикат из малого словаря, объект) делает утверждение ребром
      графа. Метка происхождения: deterministic / inferred / human-curated. Утверждение —
      позиция документа, не истина о мире.
    attributes:
      - {name: identity, status: fixed, marks: identity, note: "производна от (якорь, нормализованное содержание)"}
      - {name: anchor_required, status: fixed, note: "валидация на входе; без якоря непредставимо"}
      - {name: spo_structure, status: fixed, note: "опциональная тройка субъект-предикат-объект — ребро графа"}
      - {name: predicate_vocabulary, status: placeholder, trigger: enrichment_spec, note: "малый словарь предикатов"}
      - {name: temporal_reference, status: placeholder, trigger: enrichment_spec, note: "о каком времени говорит утверждение"}
      - {name: provenance_label, status: fixed, note: "deterministic / inferred / human-curated"}
      - {name: extractor_version, status: fixed, marks: version}
      - {name: semantics, status: fixed, note: "позиция документа, не истина о мире"}
  - id: TypedReference
    ru: "Типизированная ссылка"
    group: facts_graph
    layer: enrichment
    kind: data
    definition: |
      Ребро документ↔документ (cites / amends / implements / supersedes; словарь на основе
      онтологии ELI). Добывается детерминированно: из payload коннектора либо
      сопоставлением идентификаторов в тексте с координатами известных корпусу работ;
      текстовая находка несёт якорь. Висячие ссылки (цитируется, но в корпусе нет) —
      машинные подсказки добычи.
    attributes:
      - {name: base_types, status: fixed, note: "cites/amends/implements/supersedes — база ELI"}
      - {name: full_type_vocabulary, status: placeholder, trigger: enrichment_spec}
      - {name: source, status: fixed, note: "payload коннектора | идентификатор в тексте (с якорем)"}
  - id: WorldEntity
    ru: "Сущность мира"
    group: facts_graph
    layer: enrichment
    kind: data
    definition: |
      Узел графа: организация, страна, технология и т.п. Нормализация поверхностных форм —
      через человеко-писаную таблицу (см. открытые пункты: разрешение сущностей).
    attributes:
      - {name: normalization_table, status: placeholder, trigger: enrichment_spec, note: "открытый пункт: разрешение сущностей"}
  - id: ControlledVocabulary
    ru: "Контролируемый словарь"
    group: facts_graph
    layer: foundation
    kind: data_file
    definition: |
      Внешний словарь значений классификации; проверяется в CI; код по значениям не
      ветвится. Писатель — человек (кардинальность десятков).
    attributes:
      - {name: mechanism, status: fixed, note: "внешний словарь, CI-валидация, код не ветвится"}
      - {name: vocabulary_contents, status: placeholder, trigger: first_vocabulary_consumer_spec, note: "составы: издатели, типы, юрисдикции, уровни, обязательность, тематики, предикаты, типы ссылок, типы узлов"}
  - id: AuthorityRuleTable
    ru: "Таблица авторитетности"
    group: facts_graph
    layer: foundation
    kind: data_file
    definition: |
      Человеко-писаная таблица: (издатель, тип, обязательность, уровень) → класс
      авторитетности. Документы получают класс вычислением, никогда — рукой.
    attributes:
      - {name: mechanism, status: fixed, note: "(издатель, тип, обязательность, уровень) → класс"}
      - {name: table_content, status: placeholder, trigger: enrichment_spec}
  - id: GraphLayer
    ru: "Граф"
    group: facts_graph
    layer: enrichment
    kind: derived
    definition: |
      Производный слой: узлы — работы, сущности мира, темы; рёбра — типизированные ссылки
      и утверждения; поверх — производные агрегаты. Мультиструктурность — проекции по
      типам рёбер, каждая со своей кластеризацией сообществ; иерархии самособираются из
      данных, несут метку inferred и служат навигации, не фактам. Человек пишет только
      мета-уровень: словари типов узлов и предикатов, посев таблицы нормализации.
    attributes:
      - {name: node_types, status: fixed, note: "работы, сущности мира, темы"}
      - {name: projections, status: fixed, note: "мультиструктурность — проекции по типам рёбер"}
      - {name: communities, status: fixed, note: "кластеризация Leiden-класса на проекциях; метка inferred; навигация, не факты"}
      - {name: meta_hierarchy, status: placeholder, trigger: enrichment_spec, note: "словарь типов узлов + предикатов + посев нормализации"}
      - {name: community_summaries, status: deferred, note: "сводки сообществ — этап 2"}
  - id: VerbalizedGraphContext
    ru: "Словесная обвязка"
    group: facts_graph
    layer: enrichment
    kind: derived
    definition: |
      Текстовый контекст (сущности, связи, принадлежность), приписываемый фрагменту перед
      эмбеддингом — так граф входит в вектора через текст. Вход эмбеддера ≠ заякоренный
      текст: что подавалось модели — параметр в манифесте деривации, якорей не касается.
    attributes:
      - {name: mechanism, status: fixed, note: "граф входит в вектора через текст; вход эмбеддера ≠ заякоренный текст"}
      - {name: template, status: placeholder, trigger: enrichment_spec}

  # --- Реестр и хранение ---
  - id: CorpusRegistry
    ru: "Реестр корпуса"
    group: storage
    layer: registry
    kind: store
    definition: |
      Картотека корпуса, версионируется в git рабочего пространства. На документ — два
      файла с разными писателями: машинная запись (record; человек не правит никогда)
      и необязательные разреженные поправки (overrides; единственная руками правимая
      поверхность; поправка бьёт машинное значение). Граница хранения по смыслу:
      **членство в корпусе и жизненный цикл → git; ход обработки → машинное хранилище.**
      Кандидаты до приёмки записей в git не имеют. Коммит реестра — то, чем штампуются
      деливераблы.
    attributes:
      - {name: record_machine, status: fixed, note: "машинная запись; человек не правит"}
      - {name: overrides_human, status: fixed, note: "разреженные поправки — единственная ручная поверхность; бьют машинное"}
      - {name: record_schema, status: placeholder, trigger: ingest_spec}
      - {name: storage_boundary, status: fixed, note: "членство и жизненный цикл → git; ход обработки → машинное хранилище"}
  - id: MachineStore
    ru: "Машинное хранилище"
    group: storage
    layer: foundation
    kind: store
    definition: |
      Встраиваемое бессерверное табличное хранилище машинного состояния: журналы,
      утверждения, якоря, очереди склеек, курсоры, уверенности. Это роль, не движок:
      конкретный движок выбирается на этапе реализации измерением.
    attributes:
      - {name: role, status: fixed, note: "встраиваемое, бессерверное, табличное"}
      - {name: engine, status: implementation_time, note: "выбор измерением; наследник старого проекта — кандидат, не победитель"}
  - id: VectorIndex
    ru: "Векторный индекс"
    group: storage
    layer: enrichment
    kind: derived
    definition: |
      Производный слой: плотные вектора фрагментов от одной мультиязычной облачной
      модели (роль; конкретная модель и точность — выбор этапа реализации). Несёт
      манифест деривации; вход эмбеддера ≠ заякоренный текст.
    attributes:
      - {name: embedding_model, status: implementation_time, note: "роль: одна мультиязычная облачная модель на весь корпус"}
      - {name: precision_dims, status: implementation_time, note: "точность/размерность — по бюджету памяти, измерением"}
  - id: LexicalIndex
    ru: "Лексический индекс"
    group: storage
    layer: enrichment
    kind: derived
    definition: |
      Производный слой: локальный полнотекстовый канал класса BM25 — точность по
      идентификаторам и числам. Движок — выбор этапа реализации; несёт манифест
      деривации.
    attributes:
      - {name: role, status: fixed, note: "локальный, BM25-класса — точность по идентификаторам и числам"}
      - {name: engine, status: implementation_time}
  - id: DerivationManifest
    ru: "Манифест деривации"
    group: storage
    layer: foundation
    kind: data
    definition: |
      Паспорт производного артефакта: коммит реестра + версии записей деривации
      (экстракторов, модели эмбеддинга, параметров входа).
    attributes:
      - {name: registry_commit, status: fixed}
      - {name: derivation_versions, status: fixed, marks: version, note: "версии экстракторов/модели эмбеддинга/параметров входа"}
  - id: Corpus
    ru: "Корпус"
    group: storage
    layer: registry
    kind: term
    definition: |
      Не хранимая сущность, а предикат состояния: корпус = все активные документы реестра.
      Нет id, нет конфигурации, нет собственного жизненного цикла.
    attributes: []
  - id: Workspace
    ru: "Рабочее пространство"
    group: storage
    layer: foundation
    kind: store
    definition: |
      Директория корпуса, индексов и деливераблов со своим git — всегда отдельно от
      репозитория кода.
    attributes:
      - {name: separate_git, status: fixed, note: "свой git; всегда отдельно от репозитория кода"}

  # --- Процессы ---
  - id: AdmissionMinimum
    ru: "Минимум приёмки"
    group: processes
    layer: registry
    kind: process
    definition: |
      Именованная, версионируемая, машинно-проверяемая политика: без чего кандидат не
      становится активным. Одна функция структурных инвариантов: загрузчик падает,
      валидатор собирает. Состав — открытый пункт с обязательным доуточнением.
    attributes:
      - {name: mechanism, status: fixed, note: "одна функция: загрузчик падает, валидатор собирает; версионируема"}
      - {name: composition, status: placeholder, trigger: ingest_spec, note: "главный открытый пункт"}
  - id: Triage
    ru: "Триаж"
    group: processes
    layer: curation
    kind: process
    definition: |
      Суждение о включении кандидата в корпус — на полных данных, после скачивания и
      конвертации. Сначала правила, дешёвая модель — где правил мало. Вердикт с причиной
      записывается; процедуры удаления не существует: сырьё остаётся, история остаётся,
      пере-триаж — реконсиляция при смене политики.
    attributes:
      - {name: full_evidence, status: fixed, note: "после скачивания и конвертации"}
      - {name: verdict_with_reason, status: fixed, note: "вердикт останавливает продвижение; удаления не существует"}
      - {name: rules_then_llm, status: fixed, note: "сначала правила, дешёвая модель где правил мало"}
      - {name: ruleset, status: placeholder, trigger: ingest_spec}
  - id: Deduplication
    ru: "Дедупликация"
    group: processes
    layer: curation
    kind: process
    definition: |
      Две точки принуждения. На входе — только детерминированное, автоматически: хэш
      payload (зеркала) + белый список надёжных координатных схем (URL не склеивает
      никогда). После приёмки — нечёткое, только предложениями: близость векторов +
      нормализация названий → очередь куратору. Ложная склейка хуже пропущенной.
    attributes:
      - {name: point1_deterministic, status: fixed, note: "на входе, автоматически: хэш payload + белый список схем"}
      - {name: point2_fuzzy, status: fixed, note: "после приёмки, только предложения: близость векторов + названия"}
      - {name: asymmetry, status: fixed, note: "ложная склейка хуже пропущенной"}
  - id: MergeOperation
    ru: "Склейка"
    group: processes
    layer: curation
    kind: process
    definition: |
      Операция над живыми документами: выживший Document забирает линейки версий;
      идентификатор дубля становится вечным алиасом — не удаляется и не переиспользуется.
    attributes:
      - {name: alias, status: fixed, note: "id дубля — вечный алиас; не удаляется, не переиспользуется"}
      - {name: version_takeover, status: fixed, note: "выживший забирает линейки версий"}
  - id: Enrichment
    ru: "Обогащение"
    group: processes
    layer: enrichment
    kind: process
    definition: |
      Производство хранимых производных слоёв в стиле реконсиляции. Всё производное
      восстановимо из корпуса и никогда не пишет назад. Двухуровневая инкрементальность:
      единица пере-деривации — версия содержимого; единица дорогого перерасчёта —
      контент-адресованный фрагмент.
    attributes:
      - {name: reconciliation_style, status: fixed}
      - {name: two_level_incrementality, status: fixed, note: "пере-деривация — версия; дорогой перерасчёт — фрагмент"}
      - {name: language_routing, status: fixed, note: "экстрактор — запись расширения с ключом по языку; региональная модель — кандидат для черногорского"}
  - id: ExceptionQueue
    ru: "Очередь исключений"
    group: processes
    layer: curation
    kind: process
    definition: |
      Единственная точка, где машина зовёт человека внутрь потока данных: неуверенные
      извлечения и неоднозначные склейки. Состав и правила — открытый пункт
      (спецификация обогащения).
    attributes:
      - {name: concept, status: fixed, note: "неуверенные извлечения и неоднозначные склейки — человеку"}
      - {name: detail, status: placeholder, trigger: enrichment_spec}
  - id: Reconciliation
    ru: "Реконсиляция"
    group: processes
    layer: foundation
    kind: process
    definition: |
      Дисциплина батчей: работа выводится из состояния мира, не из хранимого флага;
      повторный прогон — пустая операция; чинится история, а не только будущее. Отказ
      элемента не роняет батч; аварийность выше порога прерывает прогон; чекпоинты,
      идемпотентные единицы.
    attributes:
      - {name: level_triggered, status: fixed, note: "работа от состояния мира; повторный прогон — пустая операция; чинит историю"}
      - {name: item_isolation_breaker, status: fixed, note: "отказ элемента не роняет батч; порог аварийности прерывает прогон"}
      - {name: checkpoints_idempotent, status: fixed}

  # --- Запросы и синтез ---
  - id: QueryLayer
    ru: "Слой запросов"
    group: query_synthesis
    layer: query
    kind: process
    definition: |
      По-вопросные вычисления, ничего не хранит. Гибридный поиск (плотные вектора из
      облака + локальный лексический канал) → слияние → посевные узлы → расширение по
      графу (Personalized PageRank) → выдача с якорями. Будущий реранкер — ступень здесь.
      Проверка свежести — по манифестам деривации, с честным объявлением отставания. Путь ответа обязан
      отказаться («в корпусе этого нет»), а не догадаться. Тренды — счётные запросы к
      слою утверждений; семантика числа: представленность в корпусе, не независимая
      корроборация.
    attributes:
      - {name: pipeline, status: fixed, note: "плотный+лексический → слияние → посев → PPR → выдача с якорями | отказ"}
      - {name: fusion_method, status: implementation_time, note: "роль — слияние класса RRF"}
      - {name: refusal_contract, status: fixed, note: "обязан отказаться, а не догадаться"}
      - {name: freshness_check, status: fixed, note: "по манифестам деривации; отставание объявляется явно"}
      - {name: reranker, status: deferred, note: "ступень здесь; триггер — измерение качества поиска; только API"}
  - id: TrendQuery
    ru: "Запрос тренда"
    group: query_synthesis
    layer: query
    kind: process
    definition: |
      Счётный запрос к слою утверждений: считаются работы, не языковые копии.
      Семантика числа — представленность в корпусе, не независимая корроборация;
      свёртка цитирований — этап 2.
    attributes:
      - {name: counting, status: fixed, note: "счёт по слою утверждений; считаются работы, не языковые копии"}
      - {name: semantics, status: fixed, note: "представленность в корпусе, не независимая корроборация"}
      - {name: citation_collapse, status: deferred, note: "свёртка цитирований — этап 2"}
  - id: Deliverable
    ru: "Деливерабл"
    group: query_synthesis
    layer: synthesis
    kind: data
    definition: |
      Итоговый документ: Markdown в git рабочего пространства, версионируем по построению.
      Каждая версия штампуется манифестом деривации. Семейство вариантов — над явно
      записанной матрицей параметров.
    attributes:
      - {name: markdown_git, status: fixed, note: "Markdown в git рабочего пространства"}
      - {name: stamp, status: fixed, note: "манифест деривации"}
      - {name: parameter_matrix, status: fixed, note: "семейства вариантов над явной матрицей параметров"}
  - id: DeliverableValidator
    ru: "Валидатор деливерабла"
    group: query_synthesis
    layer: synthesis
    kind: process
    definition: |
      Механический контролёр черновика: каждое фактическое утверждение несёт разрешимую
      ссылку на якорь; не имеющее ссылки либо явно помечено как суждение автора, либо
      удаляется.
    attributes:
      - {name: mechanism, status: fixed, note: "каждое утверждение → разрешимая ссылка на якорь; иначе пометка «суждение автора» или удаление"}
      - {name: check_rules, status: placeholder, trigger: synthesis_workshop_spec}

  # --- Сквозное ---
  - id: NetworkClient
    ru: "Сетевой клиент"
    group: cross_cutting
    layer: foundation
    kind: process
    definition: |
      Единственный модуль всех исходящих вызовов — и моделей, и скачивания: повторы с
      нарастающими паузами и разбросом, распознавание ошибки внутри успешного ответа,
      немедленный отказ на постоянных ошибках, вежливость к сайтам, бюджетные
      предохранители на прогон.
    attributes:
      - {name: single, status: fixed, note: "все исходящие вызовы — модели И скачивание"}
      - {name: armour, status: fixed, note: "повторы+разброс, ошибка-в-успехе, fail-fast, вежливость, бюджетные предохранители"}
  - id: WriterLock
    ru: "Замок писателя"
    group: cross_cutting
    layer: foundation
    kind: process
    definition: |
      Один замок на все пишущие операции рабочего пространства, включая каждую подкоманду;
      чтение — без замка, по снимку.
    attributes:
      - {name: single_lock, status: fixed, note: "один замок на все пишущие команды пространства"}
      - {name: lockfree_reads, status: fixed, note: "чтение по снимку, без замка"}

