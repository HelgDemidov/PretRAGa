# Evidence ci.yml's six checks can actually fail: plants a defect in each,
# demands a red suite. Separate workflow, not a step in `gate` — a
# different question (can checks still fail?) than the six ask (does code
# violate a rule?) — with its own check-list entry.
#
# PR-only, costs several times the six steps; back on every push below two
# minutes. `-n auto`: each mutation runs its own ring, so this is real
# parallelism — measured 627s serial -> 252s on 4 cores, same result.
# RED CONTROL INVALIDATES THE WHOLE RUN: inner suite stops at first
# failure, so a broken ring reads every mutation as killed by that break.

name: Mutation stand

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutation-stand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups -p 3.12

      - name: Mutation harness
        run: uv run pytest -m heavy -q -n auto
