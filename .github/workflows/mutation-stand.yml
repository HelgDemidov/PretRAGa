# Evidence ci.yml's 6 checks can actually fail: plants a defect in each,
# demands a red suite. Separate workflow, not a step in `gate` — a
# different question (can checks still fail?) than the 6 ask (does code
# violate a rule?) — with its own check-list entry.
#
# Runs on push+PR, docs-only changes excluded (nothing there is exercised
# by any test). Threshold 180s on GitHub's runners specifically, not
# local — measured 129s; revert to PR-only if it exceeds that.
# `-n auto`: each mutation runs its own ring, real parallelism — measured
# 627s serial -> 252s on 4 local cores, same result.
# RED CONTROL INVALIDATES THE WHOLE RUN: inner suite stops at first
# failure, so a broken ring reads every mutation as killed by that break.

name: Mutation stand

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: mutation-stand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups -p 3.12

      - name: Mutation harness
        run: uv run pytest -m heavy -q -n auto
