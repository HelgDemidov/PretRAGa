# The remote half of the gate. It runs the SAME six checks as the local gate
# command in CLAUDE.md §10, with the same marker filter — on divergence, that
# command is reconciled against this file, not the other way round — plus the
# mutation harness, which is CI-only and pull-request-only: it is the evidence
# that those six can fail, and it is too slow for the everyday local command.
#
# One job, not several. Installing the locked dependencies is cached, so
# splitting would pay for that install repeatedly and save no wall clock. What
# splitting is actually for — telling which check failed — is already provided
# by per-step status, and `if: '!cancelled()'` keeps a single failure from
# hiding the rest. Split this the day a real matrix appears, not before.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Full history, not a shallow clone: the schema-version rule compares the
      # lock against the point this branch left the trunk. Without the trunk in
      # the clone that comparison silently has nothing to compare.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned to an exact version: setup-uv no longer publishes moving major
      # tags, and dependabot bumps this line.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups -p 3.12

      - name: Lint
        run: uv run ruff check

      # git decides what is ours, so this needs no path list and needs no edit
      # when src/ appears. An empty file list would make the step pass without
      # checking anything, which reads exactly like success — so say it loudly
      # instead.
      - name: Types
        if: '!cancelled()'
        run: |
          files=$(git ls-files --cached --others --exclude-standard '*.py')
          if [ -z "$files" ]; then
            echo "NOTHING RAN: no Python files are tracked, so mypy checked nothing."
            exit 1
          fi
          echo "$files" | xargs uv run mypy

      - name: Tests
        if: '!cancelled()'
        run: uv run pytest -m "not heavy" --cov --cov-report=term-missing

      - name: Import contracts
        if: '!cancelled()'
        env:
          PYTHONPATH: src
        run: uv run lint-imports

      - name: Domain truth
        if: '!cancelled()'
        run: uv run python tools/truth.py

      - name: Schema lock
        if: '!cancelled()'
        run: uv run python tools/schema_lock.py

      # The only direct evidence that any of the checks above can FAIL: it
      # plants a defect in each one in turn and demands a red suite. Without it
      # the other six steps are green with nothing establishing that green
      # means anything, and it lived on discipline rather than on the pipeline.
      #
      # Pull requests only. It costs several times the six steps together —
      # measure before moving it, and put it back on every push the day it
      # drops under two minutes. Core count does not help: measured no slower
      # on two cores than on four, so the work is serial.
      #
      # A RED CONTROL INVALIDATES THE WHOLE RUN, not just its own line. The
      # inner suite stops at the first failure, so if the untouched ring is
      # already broken every mutation is reported killed by that break rather
      # than by the mutation — 47 green lines meaning nothing. Measured.
      - name: Mutation harness
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: uv run pytest -m heavy -q
